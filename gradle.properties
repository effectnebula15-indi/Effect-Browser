org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# AGP 9 ships built-in Kotlin support and a new DSL. KSP -- which Room's compiler runs on --
# is not compatible with built-in Kotlin, so we opt out of it and apply the standalone
# org.jetbrains.kotlin.android plugin. That plugin in turn cannot see AGP 9's new DSL, so the
# old DSL is kept as well. Both flags are the migration path Google documents; revisit once KSP
# supports built-in Kotlin.
# https://kotl.in/gradle/agp-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

kotlin.code.style=official
